<script>
        // Simple micro-interaction for ripples or state updates
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('click', function(e) {
                // Future expansion: ripple effect logic
            });
        });

        // Dynamic scroll behavior for the TopAppBar
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('shadow-md');
                header.classList.add('bg-surface/95');
                header.classList.add('backdrop-blur-sm');
            } else {
                header.classList.remove('shadow-md');
                header.classList.remove('bg-surface/95');
                header.classList.remove('backdrop-blur-sm');
            }
        });
    </script>
